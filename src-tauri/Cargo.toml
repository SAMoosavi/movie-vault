[package]
name = "movie-vault"
version = "0.2.3"
authors = ["S.A. Moosavi"]
edition = "2024"
description = "A cross-platform Tauri desktop app for managing and organizing your movie collection"
readme = "../README.md"
license = "MIT"
repository = "https://github.com/SAMoosavi/movie-vault"

[lib]
name = "movie_vault_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Framework
tauri = { version = "2", features = [] }

# Plugins
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = { version = "2", features = ["json", "rustls-tls"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2.4"
tauri-plugin-log = "2"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Async / Utilities
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rayon = "1.9"
walkdir = "2"
regex = "1"
tempfile = "3.20"
itertools = "0.14"
rand = "0.9"

# Data & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Database
diesel = { version = "2.3", features = ["sqlite", "r2d2", "chrono"] }
diesel_migrations = "2.3"
r2d2 = "0.8.10"
libsqlite3-sys = { version = "0.35", features = ["bundled"] }

# Testing & Mocks
mockall = "0.14"
mockito = "1.2"
tokio-test = "0.4"
