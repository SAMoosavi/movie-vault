name: Release Branch Build

on:
  pull_request:
    types: [closed]
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  check_version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify configuration files exist
        run: |
          if [ ! -f src-tauri/tauri.conf.json ]; then
            echo "Error: src-tauri/tauri.conf.json not found"
            exit 1
          fi
          if [ ! -f src-tauri/Cargo.toml ]; then
            echo "Error: src-tauri/Cargo.toml not found"
            exit 1
          fi
          if [ ! -f package.json ]; then
            echo "Error: package.json not found"
            exit 1
          fi

      - name: Check version consistency
        id: get_version
        run: |
          TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO_VERSION=$(grep '^version =' src-tauri/Cargo.toml | awk '{print $3}' | tr -d '"')
          PACKAGE_VERSION=$(jq -r .version package.json)
          echo "TAURI_VERSION=$TAURI_VERSION"
          echo "CARGO_VERSION=$CARGO_VERSION"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION"
          if [ -z "$TAURI_VERSION" ] || [ -z "$CARGO_VERSION" ] || [ -z "$PACKAGE_VERSION" ]; then
            echo "Error: One or more version fields are empty"
            exit 1
          fi
          if [ "$TAURI_VERSION" != "$CARGO_VERSION" ] || [ "$TAURI_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version mismatch: tauri=$TAURI_VERSION cargo=$CARGO_VERSION package=$PACKAGE_VERSION"
            exit 1
          fi
          echo "version=$TAURI_VERSION" >> $GITHUB_OUTPUT
          echo "Version set to: $TAURI_VERSION"

  build:
    if: github.event.pull_request.merged == true
    needs: check_version

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install JS dependencies
        run: pnpm install

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust dependencies
        run: cargo fetch
        working-directory: src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Signing happens during build via environment variables
      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  publish:
    if: github.event.pull_request.merged == true
    needs: [check_version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug - List all downloaded artifacts
        run: |
          echo "=== All downloaded artifacts ==="
          find artifacts -type f | sort
          echo "================================"

      - name: Generate update manifest (latest.json)
        run: |
          VERSION="${{ needs.check_version.outputs.version }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"

          echo "Creating update manifest for version: $VERSION"

          # Function to find file and signature
          find_bundle() {
            local platform_dir="$1"
            local pattern="$2"
            local file=$(find "artifacts/artifacts-${platform_dir}" -name "${pattern}" ! -name "*.sig" 2>/dev/null | head -1)
            local sig_file="${file}.sig"
            
            if [ -f "$file" ] && [ -f "$sig_file" ]; then
              echo "$(basename "$file")|$(cat "$sig_file")"
            else
              echo ""
            fi
          }

          # Find all bundles
          LINUX_RESULT=$(find_bundle "linux-x86_64" "*.AppImage")
          WINDOWS_RESULT=$(find_bundle "windows-x86_64" "*.exe")
          MACOS_ARM_RESULT=$(find_bundle "darwin-aarch64" "*.app.tar.gz")
          MACOS_X64_RESULT=$(find_bundle "darwin-x86_64" "*.app.tar.gz")

          # Parse results
          LINUX_FILE=$(echo "$LINUX_RESULT" | cut -d'|' -f1)
          LINUX_SIG=$(echo "$LINUX_RESULT" | cut -d'|' -f2)

          WINDOWS_FILE=$(echo "$WINDOWS_RESULT" | cut -d'|' -f1)
          WINDOWS_SIG=$(echo "$WINDOWS_RESULT" | cut -d'|' -f2)

          MACOS_ARM_FILE=$(echo "$MACOS_ARM_RESULT" | cut -d'|' -f1)
          MACOS_ARM_SIG=$(echo "$MACOS_ARM_RESULT" | cut -d'|' -f2)

          MACOS_X64_FILE=$(echo "$MACOS_X64_RESULT" | cut -d'|' -f1)
          MACOS_X64_SIG=$(echo "$MACOS_X64_RESULT" | cut -d'|' -f2)

          echo "Found bundles:"
          echo "  linux-x86_64: $LINUX_FILE"
          echo "  windows-x86_64: $WINDOWS_FILE"
          echo "  darwin-aarch64: $MACOS_ARM_FILE"
          echo "  darwin-x86_64: $MACOS_X64_FILE"

          # Build platforms JSON dynamically
          PLATFORMS=""

          if [ -n "$LINUX_FILE" ]; then
            PLATFORMS="$PLATFORMS\"linux-x86_64\": { \"signature\": \"$LINUX_SIG\", \"url\": \"$REPO_URL/$LINUX_FILE\" },"
          fi

          if [ -n "$WINDOWS_FILE" ]; then
            PLATFORMS="$PLATFORMS\"windows-x86_64\": { \"signature\": \"$WINDOWS_SIG\", \"url\": \"$REPO_URL/$WINDOWS_FILE\" },"
          fi

          if [ -n "$MACOS_ARM_FILE" ]; then
            PLATFORMS="$PLATFORMS\"darwin-aarch64\": { \"signature\": \"$MACOS_ARM_SIG\", \"url\": \"$REPO_URL/$MACOS_ARM_FILE\" },"
          fi

          if [ -n "$MACOS_X64_FILE" ]; then
            PLATFORMS="$PLATFORMS\"darwin-x86_64\": { \"signature\": \"$MACOS_X64_SIG\", \"url\": \"$REPO_URL/$MACOS_X64_FILE\" },"
          fi

          # Remove trailing comma
          PLATFORMS=$(echo "$PLATFORMS" | sed 's/,$//')

          # Generate manifest
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Release v${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              ${PLATFORMS}
            }
          }
          EOF

          echo "=== Generated latest.json ==="
          cat latest.json
          echo "=============================="

      - name: Prepare release files
        run: |
          mkdir -p release-files

          # Copy all distributable files (not .sig files - they're embedded in manifest)
          find artifacts -type f \( \
            -name "*.AppImage" \
            -o -name "*.deb" \
            -o -name "*.rpm" \
            -o -name "*.dmg" \
            -o -name "*.exe" \
            -o -name "*.app.tar.gz" \
          \) ! -name "*.sig" -exec cp {} release-files/ \;

          cp latest.json release-files/

          echo "=== Files to upload ==="
          ls -la release-files/
          echo "======================="

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check_version.outputs.version }}
          name: Release v${{ needs.check_version.outputs.version }}
          body: |
            ## Release v${{ needs.check_version.outputs.version }}

            ### Downloads
            - **Linux**: `.AppImage`, `.deb`, `.rpm`
            - **macOS**: `.dmg` (manual install), `.app.tar.gz` (auto-update)
            - **Windows**: `.exe`

            ### Auto-Update
            This release includes `latest.json` for the Tauri updater plugin.
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
