name: Pre-Release Branch Build

on:
  pull_request:
    # types: [closed]
    branches:
      - 'release/*'

permissions:
  contents: write

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify configuration files exist
        run: |
          if [ ! -f src-tauri/tauri.conf.json ]; then
            echo "Error: src-tauri/tauri.conf.json not found"
            exit 1
          fi
          if [ ! -f src-tauri/Cargo.toml ]; then
            echo "Error: src-tauri/Cargo.toml not found"
            exit 1
          fi
          if [ ! -f package.json ]; then
            echo "Error: package.json not found"
            exit 1
          fi

      - name: Check version consistency
        id: get_version
        run: |
          echo "🔍 Checking version consistency..."
          PACKAGE_VERSION=$(jq -r .version package.json)
          TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO_VERSION=$(grep '^version =' src-tauri/Cargo.toml | awk '{print $3}' | tr -d '"')

          echo "📦 package.json: $PACKAGE_VERSION"
          echo "🦀 Cargo.toml: $CARGO_VERSION"
          echo "🚀 tauri.conf.json: $TAURI_VERSION"

          if [ -z "$PACKAGE_VERSION" ] || [ -z "$CARGO_VERSION" ] || [ -z "$TAURI_VERSION" ]; then
            echo "❌ Error: One or more version fields are empty"
            exit 1
          fi

          if [ "$PACKAGE_VERSION" != "$TAURI_VERSION" ] || [ "$PACKAGE_VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ Version mismatch detected"
            echo "package.json=$PACKAGE_VERSION tauri.conf=$TAURI_VERSION cargo=$CARGO_VERSION"
            exit 1
          fi

          echo "✅ Version consistency confirmed: $PACKAGE_VERSION"
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

  build:
    needs: check_version

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install JS dependencies
        run: pnpm install

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust dependencies
        run: cargo fetch
        working-directory: src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.rpm

  publish:
    needs: [check_version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Sign artifacts (Tauri)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd artifacts
          for file in $(find . -type f -name "*.AppImage" -o -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm"); do
            echo "Signing $file"
            pnpm tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" --path "$file" || true
          done

      - name: Generate Tauri update manifest
        run: |
          VERSION=${{ needs.check_version.outputs.version }}
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO_URL=https://github.com/${{ github.repository }}/releases/download/v$VERSION
          cat <<EOF > latest.json
          {
            "version": "$VERSION",
            "notes": "Automated release build from CI",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "linux-x86_64": {
                "signature": "$(cat artifacts/**/*.AppImage.sig | head -n 1)",
                "url": "$REPO_URL/movie-vault_$VERSION_amd64.AppImage"
              },
              "linux-deb-x86_64": {
                "signature": "$(cat artifacts/**/*.deb.sig | head -n 1)",
                "url": "$REPO_URL/movie-vault_$VERSION_amd64.deb"
              },
              "linux-rpm-x86_64": {
                "signature": "$(cat artifacts/**/*.rpm.sig | head -n 1)",
                "url": "$REPO_URL/movie-vault_$VERSION_amd64.rpm"
              },
              "windows-x86_64": {
                "signature": "$(cat artifacts/**/*.exe.sig | head -n 1)",
                "url": "$REPO_URL/movie-vault_$VERSION_x64_en-US.exe"
              },
              "darwin-aarch64": {
                "signature": "$(cat artifacts/**/*arm64.dmg.sig | head -n 1)",
                "url": "$REPO_URL/movie-vault_$VERSION_arm64.dmg"
              },
              "darwin-x86_64": {
                "signature": "$(cat artifacts/**/*x64.dmg.sig | head -n 1)",
                "url": "$REPO_URL/movie-vault_$VERSION_x64.dmg"
              }
            }
          }
          EOF

      - name: Upload build & manifest assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check_version.outputs.version }}
          name: 'Release v${{ needs.check_version.outputs.version }}'
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/*.rpm
            artifacts/**/*.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
